name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-bundle:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/test-release-tools.sh
      - run: ./scripts/build-release-app.sh --unsigned --output-dir artifacts/ci
      - run: plutil -lint 'artifacts/ci/Screen Privacy.app/Contents/Info.plist'
      - run: test "$(lipo -archs 'artifacts/ci/Screen Privacy.app/Contents/MacOS/ScreenPrivacy')" = 'x86_64 arm64' || test "$(lipo -archs 'artifacts/ci/Screen Privacy.app/Contents/MacOS/ScreenPrivacy')" = 'arm64 x86_64'
      - run: test -x 'artifacts/ci/Screen Privacy.app/Contents/MacOS/ScreenPrivacy'
      - run: ditto -c -k --sequesterRsrc --keepParent 'artifacts/ci/Screen Privacy.app' artifacts/ci/ScreenPrivacy-ci.zip
      - run: shasum -a 256 artifacts/ci/ScreenPrivacy-ci.zip > artifacts/ci/ScreenPrivacy-ci.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenPrivacy-ci-app
          path: artifacts/ci/ScreenPrivacy-ci.zip*
